[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "min-gp"
version = "0.1.0"
description = "GPU-accelerated minute-level genetic-programming factor miner"
requires-python = ">=3.10,<3.13"
dependencies = [
    "backtrader>=1.9.78.123",
    "cvxpy>=1.6",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.14",
    "torch==2.5.1",
]

[project.optional-dependencies]
data = [
    "akshare>=1.18",
    "python-dotenv>=1.0",
    "tushare>=1.4.29",
    "tqsdk>=3.8",
]

[project.scripts]
min-gp-calibrate-seeds = "min_gp.benchmark_seed_operators:main"
min-gp-calibrate-nonseed = "min_gp.benchmark_nonseed_operators:main"
min-gp-handbook = "min_gp.handbook_gp:main"
min-gp-seed-tree = "min_gp.seed_tree_gp:main"

[tool.setuptools]
packages = [
    "min_gp",
    "min_gp.dsl",
    "min_gp.numeric",
    "min_gp.operators",
    "min_gp.factors",
    "min_gp.gp",
    "min_gp.evaluation",
    "min_gp.tests",
    "min_gp.data_providers",
]

package-dir = { min_gp = "分钟级因子挖掘" }

# torch on PyPI is the CPU-only build for Windows, so a plain `uv sync` silently
# replaces a working CUDA install and every run falls back to the CPU. Pin the
# wheel to PyTorch's CUDA 12.4 index instead.
# Local GPU: GTX 1070, compute capability 6.1, driver 552.12 (CUDA 12.4).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[tool.setuptools.package-data]
min_gp = ["calibrations/*.json"]
